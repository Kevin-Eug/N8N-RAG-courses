<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>China Economy Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #c8102e; --accent-ink: #ffffff; --user: #1d428a; --user-ink: #ffffff; --bot: #f0eee9;
    --error: #b42318; --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1c1c1f; --ink: #ececee; --muted: #9a9aa2; --line: #2c2c31;
      --accent: #e0344f; --user: #3b63b8; --bot: #26262b; --error: #ff8a80; --error-bg: #3a1d1d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; border-bottom: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; flex: none; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button.ghost:hover { color: var(--ink); }
  details.settings { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  details.settings summary { cursor: pointer; }
  details.settings label { display: block; margin-top: 8px; }
  details.settings input { width: 100%; margin-top: 4px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; } .row > label { flex: 1; }
  main { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot table { border-collapse: collapse; margin: 6px 0; font-size: 14px; }
  .msg.bot th, .msg.bot td { border: 1px solid var(--line); padding: 3px 8px; }
  .msg.error { align-self: flex-start; background: var(--error-bg); color: var(--error); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 3px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .empty { margin: auto 0; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 20px; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
    padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; text-align: left; }
  .chip:hover { border-color: var(--accent); }
  form.composer { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--line); }
  form.composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font: inherit; }
  form.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form.composer button { border: none; border-radius: 12px; padding: 0 18px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  form.composer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">¥</div>
    <div>
      <h1>Économie chinoise</h1>
      <p>Réponses tirées de « Broken China » (Logan Wright)</p>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="reset" type="button">Nouvelle conversation</button>
  </header>

  <details class="settings">
    <summary>Connexion au workflow n8n</summary>
    <label>URL du webhook de chat
      <input id="url" value="https://YOUR-INSTANCE.app.n8n.cloud/webhook/YOUR-CHAT-WEBHOOK-ID/chat">
    </label>
    <div class="row">
      <label>Utilisateur (si Basic Auth activée)<input id="user" autocomplete="off"></label>
      <label>Mot de passe<input id="pass" type="password" autocomplete="off"></label>
    </div>
  </details>

  <main id="messages">
    <div class="empty" id="empty">
      <h2>Pose une question sur l'économie chinoise</h2>
      <div>Le bot répond dans ta langue et cite la page du livre.</div>
      <div class="chips">
        <button class="chip" type="button">Pourquoi la croissance chinoise ralentit-elle selon l'auteur ?</button>
        <button class="chip" type="button">What happened to Evergrande?</button>
        <button class="chip" type="button">Qu'est-ce que le shadow banking en Chine ?</button>
        <button class="chip" type="button">Pourquoi les gouvernements locaux sont-ils en crise financière ?</button>
        <button class="chip" type="button">Quel est le PIB de la France ?</button>
      </div>
    </div>
  </main>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Écris ta question… (Entrée pour envoyer, Maj+Entrée pour un retour à la ligne)"></textarea>
    <button id="send" type="submit">Envoyer</button>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const messages = $('messages'), input = $('input'), send = $('send');
  const newSession = () => 'web-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
  let sessionId = newSession();

  // Only the webhook URL is remembered between visits; credentials stay in memory.
  try { const saved = localStorage.getItem('ragChatUrl'); if (saved) $('url').value = saved; } catch {}
  $('url').addEventListener('change', () => { try { localStorage.setItem('ragChatUrl', $('url').value.trim()); } catch {} });

  function addMessage(kind, content, meta) {
    $('empty')?.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    if (kind === 'bot') el.innerHTML = DOMPurify.sanitize(marked.parse(content));
    else el.textContent = content;
    if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; el.appendChild(m); }
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function ask(question) {
    question = question.trim();
    if (!question || send.disabled) return;
    addMessage('user', question);
    input.value = ''; autosize();
    send.disabled = true;
    const typing = addMessage('bot', '');
    typing.classList.add('typing');
    typing.innerHTML = '<span></span><span></span><span></span>';
    const started = performance.now();
    try {
      const headers = { 'Content-Type': 'application/json' };
      if ($('user').value) headers.Authorization = 'Basic ' + btoa($('user').value + ':' + $('pass').value);
      const res = await fetch($('url').value.trim(), {
        method: 'POST', headers,
        body: JSON.stringify({ action: 'sendMessage', sessionId, chatInput: question }),
      });
      const text = await res.text();
      if (!res.ok) throw new Error(`HTTP ${res.status} : ${text.slice(0, 300) || res.statusText}`);
      let data; try { data = JSON.parse(text); } catch { data = { output: text }; }
      const answer = (Array.isArray(data) ? data[0] : data)?.output ?? (Array.isArray(data) ? data[0] : data)?.text ?? text;
      typing.remove();
      addMessage('bot', String(answer), `${((performance.now() - started) / 1000).toFixed(1)} s`);
    } catch (err) {
      typing.remove();
      const hint = err instanceof TypeError
        ? 'Impossible de joindre le webhook. Le workflow est-il publié, avec le déclencheur de chat en mode public ?'
        : err.message;
      addMessage('error', hint);
    } finally {
      send.disabled = false; input.focus();
    }
  }

  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  $('composer').addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
  document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => ask(chip.textContent)));
  $('reset').addEventListener('click', () => { sessionId = newSession(); location.reload(); });
  input.focus();
</script>
</body>
</html>
